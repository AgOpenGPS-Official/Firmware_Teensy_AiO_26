name: Build Firmware

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly build at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  check-changes:
    # For scheduled runs, check if there were changes in last 24 hours
    if: github.event_name != 'schedule' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # For nightly builds, check if there were commits in last 24 hours
            COMMITS=$(git log --since="24 hours ago" --oneline | wc -l)
            if [ "$COMMITS" -gt 0 ]; then
              echo "Found $COMMITS commits in last 24 hours"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "No commits in last 24 hours, skipping nightly build"
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            # For push/PR/manual, always build
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Teensy 4.1 firmware
        run: pio run -e teensy41

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'FIRMWARE_VERSION' lib/aio_system/Version.h | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename firmware
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cp .pio/build/teensy41/firmware.hex "AiO_v${{ steps.version.outputs.VERSION }}_nightly_${{ steps.version.outputs.DATE }}.hex"
          else
            cp .pio/build/teensy41/firmware.hex "AiO_v${{ steps.version.outputs.VERSION }}_${{ steps.version.outputs.SHA_SHORT }}.hex"
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.VERSION }}-${{ github.event_name == 'schedule' && 'nightly' || steps.version.outputs.SHA_SHORT }}
          path: "*.hex"
          retention-days: 30
