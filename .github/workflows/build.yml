name: Build Firmware

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly build at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent changes (nightly only)
        if: github.event_name == 'schedule'
        id: check
        run: |
          COMMITS=$(git log --since="24 hours ago" --oneline | wc -l)
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits in last 24 hours, skipping nightly build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Found $COMMITS commits in last 24 hours"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: github.event_name != 'schedule' || steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        if: github.event_name != 'schedule' || steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Teensy 4.1 firmware
        if: github.event_name != 'schedule' || steps.check.outputs.skip != 'true'
        run: pio run -e teensy41

      - name: Get version info
        if: github.event_name != 'schedule' || steps.check.outputs.skip != 'true'
        id: version
        run: |
          VERSION=$(grep 'FIRMWARE_VERSION' lib/aio_system/Version.h | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename firmware
        if: github.event_name != 'schedule' || steps.check.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cp .pio/build/teensy41/firmware.hex "AiO_v${{ steps.version.outputs.VERSION }}_nightly_${{ steps.version.outputs.DATE }}.hex"
          else
            cp .pio/build/teensy41/firmware.hex "AiO_v${{ steps.version.outputs.VERSION }}_${{ steps.version.outputs.SHA_SHORT }}.hex"
          fi

      - name: Upload firmware artifact
        if: github.event_name != 'schedule' || steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.VERSION }}-${{ github.event_name == 'schedule' && 'nightly' || steps.version.outputs.SHA_SHORT }}
          path: "*.hex"
          retention-days: 30
